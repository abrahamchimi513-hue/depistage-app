# Messages de validation (référencés par les annotations : message = "{champ.obligatoire}")
champ.obligatoire=Ce champ est obligatoire.
champ.taille=Ce champ doit contenir entre {min} et {max} caractères.
champ.taille.max=Ce champ ne doit pas dépasser {max} caractères.
champ.min=La valeur doit être supérieure ou égale à {value}.
champ.selection=Veuillez sélectionner au moins un élément.
telephone.format=Le téléphone doit contenir 9 chiffres et commencer par 6.
code.format=Le code doit être en majuscules (lettres, chiffres ou tiret bas, sans espace).
date.passee=La date doit être dans le passé.
date.nonfuture=La date ne peut pas être dans le futur.
age.plage=L’âge doit être compris entre {min} et {max} ans.
periode.invalide=La date de fin ne peut pas précéder la date de début.
orientation.obligatoire=L’orientation est obligatoire lorsque le résultat n’est pas négatif.
valeur.positive=La valeur mesurée doit être positive ou nulle.

# Erreurs de saisie (texte tapé à la place d'un nombre ou d'une date)
typeMismatch=La valeur saisie est invalide.
typeMismatch.java.time.LocalDate=Date invalide.
typeMismatch.java.lang.Integer=Veuillez saisir un nombre entier.
typeMismatch.java.lang.Long=Veuillez faire un choix valide.
typeMismatch.java.math.BigDecimal=Veuillez saisir un nombre.
methodInvocation=La valeur saisie est invalide.
