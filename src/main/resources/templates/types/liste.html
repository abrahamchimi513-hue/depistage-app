<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Types de dépistage')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header('types')}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: messages}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Types de dépistage</h1>
    <a class="btn btn-primary" th:href="@{/types/nouveau}">Nouveau type</a>
  </div>
  <form method="get" th:action="@{/types}" class="input-group mb-3">
    <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Rechercher par code ou libellé">
    <button class="btn btn-outline-secondary" type="submit">Rechercher</button>
  </form>
  <p class="text-muted" th:if="${page.empty}">Aucun type ne correspond.</p>
  <div class="table-responsive" th:unless="${page.empty}">
    <table class="table table-striped">
      <thead><tr><th>Code</th><th>Libellé</th><th>Description</th><th></th></tr></thead>
      <tbody>
        <tr th:each="t : ${page.content}">
          <td><code th:text="${t.code}">CODE</code></td>
          <td th:text="${t.libelle}">Libellé</td>
          <td th:text="${t.description}">Description</td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{|/types/${t.id}/modifier|}">Modifier</a>
            <form class="d-inline" method="post" th:action="@{|/types/${t.id}/supprimer|}"
                  onsubmit="return confirm('Supprimer ce type ?');">
              <button class="btn btn-sm btn-outline-danger" type="submit">Supprimer</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:replace="~{fragments/layout :: pager(${page}, ${baseUrl}, ${qs})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
