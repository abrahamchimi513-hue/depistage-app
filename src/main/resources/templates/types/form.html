<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(${titre})}"></head>
<body>
<nav th:replace="~{fragments/layout :: header('types')}"></nav>
<main class="container" style="max-width:720px">
  <h1 class="h3 mb-3" th:text="${titre}">Type</h1>
  <form method="post" th:action="@{${action}}" th:object="${typeForm}" novalidate>
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div></div>
    <div class="mb-3"><label class="form-label" for="code">Code (majuscules, ex. DIABETE)</label>
      <input id="code" class="form-control" th:field="*{code}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{code}"></div></div>
    <div class="mb-3"><label class="form-label" for="libelle">Libellé</label>
      <input id="libelle" class="form-control" th:field="*{libelle}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{libelle}"></div></div>
    <div class="mb-3"><label class="form-label" for="description">Description (facultative, 300 caractères max.)</label>
      <textarea id="description" rows="3" class="form-control" th:field="*{description}" th:errorclass="is-invalid"></textarea>
      <div class="invalid-feedback" th:errors="*{description}"></div></div>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
    <a class="btn btn-link" th:href="@{/types}">Annuler</a>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
