<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Campagnes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header('campagnes')}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: messages}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Campagnes</h1>
    <a class="btn btn-primary" th:href="@{/campagnes/nouvelle}">Nouvelle campagne</a>
  </div>
  <form method="get" th:action="@{/campagnes}" class="input-group mb-3">
    <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Rechercher par nom ou ville">
    <button class="btn btn-outline-secondary" type="submit">Rechercher</button>
  </form>
  <p class="text-muted" th:if="${page.empty}">Aucune campagne ne correspond.</p>
  <div class="table-responsive" th:unless="${page.empty}">
    <table class="table table-striped">
      <thead><tr><th>Nom</th><th>Ville</th><th>Période</th><th>Statut</th><th>Types</th><th>Avancement</th><th></th></tr></thead>
      <tbody>
        <tr th:each="c : ${page.content}">
          <td><a th:href="@{|/campagnes/${c.id}|}" th:text="${c.nom}">Nom</a></td>
          <td th:text="${c.ville}">Ville</td>
          <td><span th:text="${#temporals.format(c.dateDebut, 'dd/MM/yyyy')}"></span> → <span th:text="${#temporals.format(c.dateFin, 'dd/MM/yyyy')}"></span></td>
          <td><span th:replace="~{fragments/layout :: badgeStatut(${c.statut})}"></span></td>
          <td th:text="${#strings.listJoin(c.types, ', ')}">DIABETE</td>
          <td style="min-width:140px">
            <div class="progress" role="progressbar">
              <div class="progress-bar" th:style="|width: ${c.avancement}%|" th:text="${c.realises} + '/' + ${c.objectif}"></div>
            </div>
          </td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{|/campagnes/${c.id}/modifier|}">Modifier</a>
            <form class="d-inline" method="post" th:action="@{|/campagnes/${c.id}/supprimer|}"
                  onsubmit="return confirm('Supprimer cette campagne ?');">
              <button class="btn btn-sm btn-outline-danger" type="submit">Supprimer</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:replace="~{fragments/layout :: pager(${page}, ${baseUrl}, ${qs})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
