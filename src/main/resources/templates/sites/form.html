<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(${titre})}"></head>
<body>
<nav th:replace="~{fragments/layout :: header('sites')}"></nav>
<main class="container" style="max-width:720px">
  <h1 class="h3 mb-3" th:text="${titre}">Site</h1>
  <form method="post" th:action="@{${action}}" th:object="${siteForm}" novalidate>
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div></div>
    <div class="mb-3"><label class="form-label" for="nom">Nom</label>
      <input id="nom" class="form-control" th:field="*{nom}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{nom}"></div></div>
    <div class="mb-3"><label class="form-label" for="quartier">Quartier</label>
      <input id="quartier" class="form-control" th:field="*{quartier}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{quartier}"></div></div>
    <div class="mb-3"><label class="form-label" for="adresse">Adresse (facultative)</label>
      <input id="adresse" class="form-control" th:field="*{adresse}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{adresse}"></div></div>
    <div class="mb-3"><label class="form-label" for="capaciteJournaliere">Capacité journalière</label>
      <input id="capaciteJournaliere" type="number" class="form-control" th:field="*{capaciteJournaliere}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{capaciteJournaliere}"></div></div>
    <div class="mb-3"><label class="form-label" for="campagneId">Campagne</label>
      <select id="campagneId" class="form-select" th:field="*{campagneId}" th:errorclass="is-invalid">
        <option value="">-- Choisir --</option>
        <option th:each="c : ${campagnes}" th:value="${c.id}" th:text="${c.label}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{campagneId}"></div></div>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
    <a class="btn btn-link" th:href="@{/sites}">Annuler</a>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
