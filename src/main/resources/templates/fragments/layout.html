<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Campagnes de dépistage'">Campagnes de dépistage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Menu : le lien de la page courante est mis en évidence -->
<nav th:fragment="header(active)" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Dépistage</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Ouvrir le menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'accueil'} ? 'active'" th:href="@{/}">Tableau de bord</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'campagnes'} ? 'active'" th:href="@{/campagnes}">Campagnes</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'sites'} ? 'active'" th:href="@{/sites}">Sites</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'agents'} ? 'active'" th:href="@{/agents}">Agents</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'participants'} ? 'active'" th:href="@{/participants}">Participants</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'types'} ? 'active'" th:href="@{/types}">Types</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'depistages'} ? 'active'" th:href="@{/depistages}">Dépistages</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm" th:href="@{/swagger-ui.html}">API (Swagger)</a>
    </div>
  </div>
</nav>

<!-- Zone de messages : confirmation (succès) ou refus (erreur) transmis après une redirection -->
<div th:fragment="messages">
  <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${succes}">
    <span th:text="${succes}">Opération réussie.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${erreur}">
    <span th:text="${erreur}">Opération refusée.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
  </div>
</div>

<!-- Pagination : conserve la recherche et les filtres grâce à la chaîne « qs » préparée par le contrôleur -->
<nav th:fragment="pager(page, baseUrl, qs)" th:if="${page.totalPages > 1}" aria-label="Pagination">
  <ul class="pagination">
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" th:href="@{|${baseUrl}?page=${page.number - 1}${qs}|}">&laquo;</a>
    </li>
    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
        th:classappend="${i == page.number} ? 'active'">
      <a class="page-link" th:href="@{|${baseUrl}?page=${i}${qs}|}" th:text="${i + 1}">1</a>
    </li>
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" th:href="@{|${baseUrl}?page=${page.number + 1}${qs}|}">&raquo;</a>
    </li>
  </ul>
</nav>

<!-- Badge de couleur d'un résultat de dépistage -->
<span th:fragment="badgeResultat(r)" class="badge"
      th:classappend="${r.name() == 'POSITIF'} ? 'bg-danger' : (${r.name() == 'A_CONFIRMER'} ? 'bg-warning text-dark' : 'bg-success')"
      th:text="${r.libelle}">Négatif</span>

<!-- Badge de couleur du statut d'une campagne -->
<span th:fragment="badgeStatut(s)" class="badge"
      th:classappend="${s.name() == 'EN_COURS'} ? 'bg-primary' : (${s.name() == 'TERMINEE'} ? 'bg-secondary' : 'bg-info text-dark')"
      th:text="${s.libelle}">En cours</span>

<footer th:fragment="footer" class="container py-4 mt-4 border-top">
  <p class="mb-0">Projet scolaire : toutes les données sont fictives.</p>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
