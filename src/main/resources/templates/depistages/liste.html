<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Dépistages')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header('depistages')}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: messages}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Dépistages</h1>
    <a class="btn btn-primary" th:href="@{/depistages/nouveau}">Enregistrer un dépistage</a>
  </div>
  <!-- Le formulaire n'envoie pas « page » : changer un filtre ramène donc à la première page -->
  <form method="get" th:action="@{/depistages}" class="row g-2 mb-3">
    <div class="col-md-4"><select name="campagneId" class="form-select">
      <option value="">Toutes les campagnes</option>
      <option th:each="c : ${campagnes}" th:value="${c.id}" th:text="${c.label}" th:selected="${c.id == campagneId}"></option>
    </select></div>
    <div class="col-md-3"><select name="typeId" class="form-select">
      <option value="">Tous les types</option>
      <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.label}" th:selected="${t.id == typeId}"></option>
    </select></div>
    <div class="col-md-3"><select name="resultat" class="form-select">
      <option value="">Tous les résultats</option>
      <option th:each="r : ${resultats}" th:value="${r}" th:text="${r.libelle}" th:selected="${r == resultat}"></option>
    </select></div>
    <div class="col-md-2 d-grid"><button class="btn btn-outline-secondary" type="submit">Filtrer</button></div>
  </form>
  <p class="text-muted" th:if="${page.empty}">Aucun dépistage ne correspond à ces filtres.</p>
  <div class="table-responsive" th:unless="${page.empty}">
    <table class="table table-striped">
      <thead><tr><th>Date</th><th>Participant</th><th>Examen</th><th>Site</th><th>Agent</th><th>Résultat</th><th>Orientation</th></tr></thead>
      <tbody>
        <tr th:each="d : ${page.content}">
          <td th:text="${#temporals.format(d.dateDepistage, 'dd/MM/yyyy')}">01/01/2026</td>
          <td th:text="${d.participantNom}">Participant</td>
          <td th:text="${d.typeLibelle}">Type</td>
          <td th:text="${d.siteNom}">Site</td>
          <td th:text="${d.agentNom}">Agent</td>
          <td><span th:replace="~{fragments/layout :: badgeResultat(${d.resultat})}"></span></td>
          <td th:text="${d.orientation}">Centre</td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:replace="~{fragments/layout :: pager(${page}, ${baseUrl}, ${qs})}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
