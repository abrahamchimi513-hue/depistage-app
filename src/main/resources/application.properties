# Profil actif : « dev » par défaut, « prod » en ligne (variable d'environnement SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=depistage-app

# Messages (validation et formulaires) en français
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Les entités ne sortent jamais de la couche service : pas de chargement paresseux dans les vues
spring.jpa.open-in-view=false

# Aucune pile d'appels ni détail technique dans les pages d'erreur
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Swagger UI : /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.depistage.controller.api

# Point de contrôle de santé : /actuator/health (aucun détail exposé)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
