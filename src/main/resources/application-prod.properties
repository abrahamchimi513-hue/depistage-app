# Profil prod : base hébergée (PostgreSQL). AUCUN secret ici : tout vient de variables d'environnement.
#   DB_URL       ex. jdbc:postgresql://hote:5432/depistage
#   DB_USER      utilisateur dédié
#   DB_PASSWORD  mot de passe
#   PORT         port d'écoute (fourni par la plateforme d'hébergement)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}

# Le schéma est mis à jour, jamais recréé ni vidé au démarrage
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

# Derrière le proxy de la plateforme (adresses https correctes dans Swagger)
server.forward-headers-strategy=framework
